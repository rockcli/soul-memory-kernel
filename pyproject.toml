[project]
name = "soul-memory-kernel"
version = "0.1.0"
description = "Zero-dependency Python kernel for local AI soul projection, scoped memory governance, privacy-preserving output gating, and budgeted extraction orchestration."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[project.scripts]
soul-memory-cli = "soul_memory_kernel.memory.cli:main"
soul-memory-soul = "soul_memory_kernel.soul.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["soul_memory_kernel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
